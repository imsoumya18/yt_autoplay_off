<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Autoplay Off</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #43a047;
    }

    p {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }

    .hint {
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="icon" src="icons/icon-32.png" alt="YT Autoplay Off icon" />
    <h1>YT Autoplay Off</h1>
  </div>

  <div class="badge">
    <span class="badge-dot"></span>
    Active
  </div>

  <p>Autoplay is automatically disabled on YouTube playlist pages.</p>

  <hr class="divider" />

  <p class="hint">
    Open any YouTube playlist — the extension handles the rest with no
    action required from you.
  </p>
</body>
</html>
